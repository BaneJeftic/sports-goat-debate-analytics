version: '3.8'

services:
  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: de_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # MinIO
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: minio
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Web UI Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data 
    command: server /data --console-address ":9001"

  # Apache NiFi
  nifi:
    image: apache/nifi:1.23.2
    container_name: de_nifi
    user: root
    ports:
      - "8443:8443"   # Secure HTTPS port for NiFi Web UI
    environment:
      - NIFI_WEB_HTTPS_PORT=8443
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_ADMIN_USER}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_ADMIN_PASSWORD}
    volumes:
      - nifi_flow_storage:/opt/nifi/nifi-current/conf
      - /var/run/docker.sock:/var/run/docker.sock

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Spark Master
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: de_spark_master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON=false
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - .:/app
      - ./postgresql-42.6.0.jar:/spark/jars/postgresql-42.6.0.jar  # <--- Dodato ovde

  # Spark Worker
  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: de_spark_worker
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
    volumes:
      - .:/app
      - ./postgresql-42.6.0.jar:/spark/jars/postgresql-42.6.0.jar  # <--- Dodato ovde

  # Postgres    
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  # Metabase
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    restart: always
    depends_on:
      - postgres
    networks:
      - default

  # Spark Streaming Worker (Driver) za stalnu obradu komentara iz Kafke
  spark-streaming-worker:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark_streaming_worker
    volumes:
      - .:/app
      - ./postgresql-42.6.0.jar:/spark/jars/postgresql-42.6.0.jar  # <--- Dodato ovde
    # Zadržavamo --packages samo za Kafku, dok Postgres povlači lokalno iz /spark/jars/
    command: /spark/bin/spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0 --master spark://spark-master:7077 /app/streaming_comments_cleanup.py
    restart: always
    depends_on:
      - kafka
      - postgres
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}    

  # Airflow Webserver & Scheduler
  airflow-webserver:
    image: apache/airflow:2.8.1-python3.10
    container_name: de_airflow
    user: root
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "1122:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - airflow_data:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    command: standalone

# Volumes
volumes:
  minio_data:
  nifi_flow_storage:
  postgres_data:
  metabase_data:
  airflow_data: